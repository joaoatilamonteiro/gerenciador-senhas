name: Build and Release Multiplataforma

on:
  push:
    tags:
      - 'v*' # Dispara a automação sempre que você criar uma tag como v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Compilar para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: GerenciadorSenhas-Windows.exe
            asset_name: GerenciadorSenhas-Windows.exe
            build_cmd: pyinstaller --noconfirm --onefile --windowed --name "GerenciadorSenhas-Windows" --add-data "interface.py;." --add-data "gerenciador_banco.py;." --collect-all streamlit --collect-all cryptography --copy-metadata streamlit --copy-metadata cryptography main.py

          - os: ubuntu-latest
            artifact_name: GerenciadorSenhas-Linux
            asset_name: GerenciadorSenhas-Linux.tar.gz
            build_cmd: pyinstaller --noconfirm --onefile --name "GerenciadorSenhas-Linux" --add-data "interface.py:." --add-data "gerenciador_banco.py:." --collect-all streamlit --collect-all cryptography --copy-metadata streamlit --copy-metadata cryptography main.py


          - os: macos-latest
            artifact_name: GerenciadorSenhas-macOS
            asset_name: GerenciadorSenhas-macOS.tar.gz
            build_cmd: pyinstaller --noconfirm --onefile --windowed --name "GerenciadorSenhas-macOS" --add-data "interface.py:." --add-data "gerenciador_banco.py:." --collect-all streamlit --collect-all cryptography --copy-metadata streamlit --copy-metadata cryptography main.py

    steps:
      - name: Baixar codigo-fonte
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar com PyInstaller
        run: ${{ matrix.build_cmd }}

      - name: Compactar build no Linux/macOS
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czf ../${{ matrix.asset_name }} GerenciadorSenhas

      - name: Compactar build no Windows
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/GerenciadorSenhas -DestinationPath GerenciadorSenhas-Windows.zip

      - name: Enviar artefatos para o Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GerenciadorSenhas-Windows.zip
            GerenciadorSenhas-Linux.tar.gz
            GerenciadorSenhas-macOS.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}