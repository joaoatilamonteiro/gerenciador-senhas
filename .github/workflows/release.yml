name: Build and Release Multiplataforma

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Compilar para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            build_cmd: pyinstaller --noconfirm --onefile --windowed --name "GerenciadorSenhas-Windows" --add-data "interface.py;." --add-data "gerenciador_banco.py;." --collect-all streamlit --collect-all cryptography --copy-metadata streamlit --copy-metadata cryptography main.py

          - os: ubuntu-latest
            build_cmd: pyinstaller --noconfirm --onefile --name "GerenciadorSenhas-Linux" --add-data "interface.py:." --add-data "gerenciador_banco.py:." --collect-all streamlit --collect-all cryptography --copy-metadata streamlit --copy-metadata cryptography main.py

          - os: macos-latest
            build_cmd: pyinstaller --noconfirm --onefile --windowed --name "GerenciadorSenhas-macOS" --add-data "interface.py:." --add-data "gerenciador_banco.py:." --collect-all streamlit --collect-all cryptography --copy-metadata streamlit --copy-metadata cryptography main.py

    steps:
      - name: Baixar codigo-fonte
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar com PyInstaller
        run: ${{ matrix.build_cmd }}

      - name: Enviar executaveis diretos para o Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GerenciadorSenhas-Windows.exe
            dist/GerenciadorSenhas-Linux
            dist/GerenciadorSenhas-macOS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}